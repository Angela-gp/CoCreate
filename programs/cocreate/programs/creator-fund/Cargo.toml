[package]
name = "creator-fund"
version = "0.1.0"
description = "Creator Fund — эскроу для краудфандинга контент-проектов на Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "creator_fund"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
