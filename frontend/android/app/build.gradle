apply plugin: "com.android.application"

android {
    namespace "app.cocreate.demo"
    compileSdk 35

    defaultConfig {
        applicationId "app.cocreate.demo"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0-demo"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
